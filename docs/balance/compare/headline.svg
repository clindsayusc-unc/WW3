<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">
<rect width="760" height="250" fill="#ffffff"/>
<text x="16" y="24" font-size="15" font-weight="600" fill="#1d2330">Headline metrics, before vs after</text>
<rect x="190" y="36" width="10" height="10" fill="#2a78d6"/><text x="204" y="45" fill="#3b4252">before</text><rect x="320" y="36" width="10" height="10" fill="#d4492c"/><text x="334" y="45" fill="#3b4252">after</text><text x="182" y="75" text-anchor="end" fill="#1d2330">Nuclear use (% of games)</text><rect x="190" y="60" width="50" height="8" fill="#2a78d6"/><text x="244" y="68" font-size="11" fill="#3b4252">10</text><rect x="190" y="70" width="10" height="8" fill="#d4492c"/><text x="204" y="78" font-size="11" fill="#3b4252">2</text><text x="182" y="105" text-anchor="end" fill="#1d2330">Full exchange (% of games)</text><rect x="190" y="90" width="10" height="8" fill="#2a78d6"/><text x="204" y="98" font-size="11" fill="#3b4252">2</text><rect x="190" y="100" width="10" height="8" fill="#d4492c"/><text x="204" y="108" font-size="11" fill="#3b4252">2</text><text x="182" y="135" text-anchor="end" fill="#1d2330">Great-power war (% of games)</text><rect x="190" y="120" width="500" height="8" fill="#2a78d6"/><text x="694" y="128" font-size="11" fill="#3b4252">100</text><rect x="190" y="130" width="470" height="8" fill="#d4492c"/><text x="664" y="138" font-size="11" fill="#3b4252">94</text><text x="182" y="165" text-anchor="end" fill="#1d2330">Wars per game</text><rect x="190" y="150" width="36" height="8" fill="#2a78d6"/><text x="230" y="158" font-size="11" fill="#3b4252">7.2</text><rect x="190" y="160" width="22" height="8" fill="#d4492c"/><text x="216" y="168" font-size="11" fill="#3b4252">4.4</text><text x="182" y="195" text-anchor="end" fill="#1d2330">Major-vs-major wars per game</text><rect x="190" y="180" width="20.5" height="8" fill="#2a78d6"/><text x="214.5" y="188" font-size="11" fill="#3b4252">4.1</text><rect x="190" y="190" width="9.5" height="8" fill="#d4492c"/><text x="203.5" y="198" font-size="11" fill="#3b4252">1.9</text><text x="182" y="225" text-anchor="end" fill="#1d2330">Capitulations by 2030</text><rect x="190" y="210" width="2" height="8" fill="#2a78d6"/><text x="196" y="218" font-size="11" fill="#3b4252">0.4</text><rect x="190" y="220" width="2" height="8" fill="#d4492c"/><text x="196" y="228" font-size="11" fill="#3b4252">0.4</text>
</svg>
