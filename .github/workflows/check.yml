name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      SCREENSHOT_NAME: ci-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_number }}
          path: |
            docs/screenshots/ci-*.png
            playwright-report/
            test-results/
          if-no-files-found: ignore
